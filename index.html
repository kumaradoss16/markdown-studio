<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://api.github.com wss:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <title>MarkForge — Markdown Studio</title>
    <link rel="icon" type="image/png" href="/markforge-icon.png" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('devspirehub:theme') || 'cyberpunk';
          const accent = localStorage.getItem('devspirehub:accent') || 'cyan';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
