[package]
name = "markforge-markdown-studio"
version = "1.0.0"
description = "MarkForge Markdown Studio - A lightweight, local-first Markdown documentation workspace for desktop"
authors = ["MarkForge Team"]
edition = "2021"

[lib]
name = "markforge_markdown_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
