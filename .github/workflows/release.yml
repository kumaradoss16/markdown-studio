name: Production Windows Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executables & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Static Analysis & Lint Quality Gate
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Run Documentation QA Check
        run: npm run qa:ci

      - name: Compile Production Windows Executables
        run: npm run build:win

      - name: Package Clean Source Code Archive
        run: npm run pack:source

      - name: Generate SHA-256 Checksums
        run: node scripts/generate-checksums.js dist-release dist-release/checksums.txt

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/*.exe
            dist-release/source-code.zip
            dist-release/checksums.txt
